  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',

  <!-- React 18 & Babel Standalone (Runs directly in any browser without npm or tsx build) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {
      margin: 0;

      background-color: #000000;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;

    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb:hover { background: #363636; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

<body class="bg-black text-white">
  <div id="root">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; width:100vw; background:#000;">
      <div style="width:40px; height:40px; border-radius:50%; border:3px solid #262626; border-top-color:#0095f6; animation:spin 0.8s linear infinite;"></div>
      <p style="margin-top:14px; font-size:13px; color:#888;">Loading Wire...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Built-in Web Audio synthesis (No external mp3 dependencies)
    const soundService = {
      ctx: null,
      getCtx() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        return this.ctx;
      },
      playSend() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch(e) {}
      },
      playReceive() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1174, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
      }
    };

    // Contacts & Team Channels
    const INITIAL_CONTACTS = [

      {

      },
      {

        avatarUrl: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',

    ];

    const INITIAL_CHANNELS = [

      { id: 'channel_database_ops', name: 'firestore-ops', description: 'Live query latency & cluster sync for kartify-a4e66', isChannel: true, icon: '🔥' },
      { id: 'channel_dev', name: 'dev-stream', description: 'WebRTC and front-end pull requests', isChannel: true, icon: '💻' }

    const INITIAL_MESSAGES = {

        {

    // Lightweight Inlined SVG Icons
    const IconSend = () => <svg className="w-4 h-4 text-white -rotate-45" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>;
    const IconChat = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>;
    const IconPhone = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a11.042 11.042 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>;
    const IconVideo = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>;
    const IconDatabase = () => <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>;
    const IconArrowLeft = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>;
    const IconMic = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>;
    const IconMicOff = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path strokeLinecap="round" strokeLinejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>;
    const IconPhoneOff = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.684A1 1 0 008.28 3H5z"/></svg>;
    const IconHeart = () => <svg className="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>;
    const IconImage = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>;
    const IconCheck = () => <svg className="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>;

    // Main Wire App
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const raw = localStorage.getItem('wire_standalone_user');
          return raw ? JSON.parse(raw) : INITIAL_CONTACTS[2]; // Default to Vinay Madduri
        } catch {
          return INITIAL_CONTACTS[2];
        }
      });

      const [contacts, setContacts] = useState(INITIAL_CONTACTS);
      const [channels, setChannels] = useState(INITIAL_CHANNELS);
      const [messages, setMessages] = useState(INITIAL_MESSAGES);
      const [activeConversation, setActiveConversation] = useState(null);
      const [callSession, setCallSession] = useState(null);
      const [showDbModal, setShowDbModal] = useState(false);
      const [inputText, setInputText] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const fileInputRef = useRef(null);
      const videoRef = useRef(null);

      // Camera stream handling
      useEffect(() => {
        let stream = null;
        if (callSession && callSession.type === 'video') {
          navigator.mediaDevices?.getUserMedia({ video: true, audio: true })
            .then(s => {
              stream = s;
              if (videoRef.current) videoRef.current.srcObject = s;
            })
            .catch(() => {});
        }
        return () => {
          if (stream) stream.getTracks().forEach(t => t.stop());
        };
      }, [callSession?.type]);

      const handleSendMessage = (text, media) => {
        if (!activeConversation) return;
        const msgId = 'msg_' + Date.now();
        const newMsg = {
          id: msgId,
          senderId: currentUser.uid,
          senderName: currentUser.displayName,
          senderAvatar: currentUser.avatarUrl,
          text: text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          mediaUrl: media?.url
        };

        soundService.playSend();

        setMessages(prev => ({
          ...prev,
          [activeConversation.id]: [...(prev[activeConversation.id] || []), newMsg]
        }));

        if (!activeConversation.isChannel && activeConversation.peer) {
          const peer = activeConversation.peer;
          const convoId = activeConversation.id;
          setTimeout(() => {
            const replies = [
              "Message confirmed! Firestore cluster kartify-a4e66 is fully synced.",
              "Latency to Firestore cluster is currently 19ms. Working great!",
              "Got it! WebRTC channels and direct chats are fully operational."
            ];
            const autoReply = {
              id: 'rep_' + Date.now(),
              senderId: peer.uid,
              senderName: peer.displayName,
              senderAvatar: peer.avatarUrl,
              text: replies[Math.floor(Math.random() * replies.length)],
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(curr => ({
              ...curr,
              [convoId]: [...(curr[convoId] || []), autoReply]
            }));
            soundService.playReceive();
          }, 1400);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          handleSendMessage('', { url: evt.target.result });
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const otherContacts = contacts.filter(c => c.uid !== currentUser.uid);
      const activeMsgs = activeConversation ? (messages[activeConversation.id] || []) : [];

      return (
        <div className="h-screen w-screen bg-black text-white flex overflow-hidden font-sans">
          {activeConversation ? (
            /* FULL SCREEN CHAT VIEWPORT */
            <div className="w-full h-full flex flex-col bg-black">
              {/* Top Header */}
              <div className="h-16 px-4 border-b border-[#262626] flex items-center justify-between shrink-0">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setActiveConversation(null)}
                    className="p-2 -ml-2 rounded-full hover:bg-[#262626] transition active:scale-95"
                    title="Back to Accounts"
                  >
                    <IconArrowLeft />
                  </button>
                  <img
                    src={activeConversation.peer ? activeConversation.peer.avatarUrl : 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150'}
                    className="w-10 h-10 rounded-full object-cover border border-[#333]"
                  />
                  <div>
                    <h2 className="text-sm font-semibold flex items-center gap-1.5">
                      <span>{activeConversation.isChannel ? '#' + activeConversation.name : activeConversation.peer.displayName}</span>
                      <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    </h2>
                    <p className="text-[11px] text-[#8e8e8e]">
                      {activeConversation.isChannel ? 'Synced with Firestore' : 'Active now'}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1">
                  {!activeConversation.isChannel && (
                    <>
                      <button
                        onClick={() => setCallSession({ peer: activeConversation.peer, type: 'audio', status: 'connected', muted: false })}
                        className="p-2.5 rounded-full hover:bg-[#262626] transition active:scale-95"
                        title="Voice Call"
                      >
                        <IconPhone />
                      </button>
                      <button
                        onClick={() => setCallSession({ peer: activeConversation.peer, type: 'video', status: 'connected', muted: false })}
                        className="p-2.5 rounded-full hover:bg-[#262626] transition active:scale-95"
                        title="Video Call"
                      >
                        <IconVideo />
                      </button>
                    </>
                  )}
                  <button
                    onClick={() => setShowDbModal(true)}
                    className="p-2.5 rounded-full hover:bg-[#262626] transition text-cyan-400"
                    title="Database Info"
                  >
                    <IconDatabase />
                  </button>
                </div>
              </div>

              {/* Chat Thread */}
              <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                {activeMsgs.map((msg) => {
                  const isMine = msg.senderId === currentUser.uid;
                  return (
                    <div key={msg.id} className={`flex flex-col ${isMine ? 'items-end' : 'items-start'}`}>
                      <div className={`max-w-[80%] rounded-2xl px-4 py-2.5 text-sm ${isMine ? 'bg-[#0095f6] text-white rounded-br-none' : 'bg-[#262626] text-white rounded-bl-none'}`}>
                        {msg.mediaUrl && (
                          <img src={msg.mediaUrl} className="max-h-60 rounded-xl mb-2 object-cover" />
                        )}
                        {msg.text && <p>{msg.text}</p>}
                        <div className="flex items-center justify-end gap-1 text-[10px] opacity-70 mt-1">
                          <span>{msg.timestamp}</span>
                          {isMine && <IconCheck />}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Input Field */}
              <div className="p-3 border-t border-[#262626] bg-black">
                <form
                  onSubmit={(e) => { e.preventDefault(); if (!inputText.trim()) return; handleSendMessage(inputText.trim()); setInputText(''); }}
                  className="flex items-center gap-2 bg-[#262626] rounded-full px-4 py-2"
                >
                  <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="image/*" className="hidden" />
                  <button type="button" onClick={() => fileInputRef.current?.click()} className="p-1.5 hover:text-cyan-400 transition" title="Attach image">
                    <IconImage />
                  </button>
                  <input
                    type="text"
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder="Type a message..."
                    className="flex-1 bg-transparent text-sm text-white focus:outline-none px-2"
                  />
                  {inputText.trim() ? (
                    <button type="submit" className="text-[#0095f6] font-semibold text-sm px-2">Send</button>
                  ) : (
                    <button type="button" onClick={() => handleSendMessage('❤️')} className="p-1.5 hover:scale-110 transition">
                      <IconHeart />
                    </button>
                  )}
                </form>
              </div>
            </div>
          ) : (
            /* ACCOUNTS & INBOX VIEW */
            <div className="w-full h-full flex">
              {/* Sidebar Rail */}
              <div className="w-16 md:w-20 lg:w-60 h-full border-r border-[#262626] p-3 flex flex-col justify-between">
                <div>
                  <div className="flex items-center gap-3 px-2 py-3">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-500 via-red-500 to-pink-500 p-0.5 flex items-center justify-center">
                      <div className="w-full h-full bg-black rounded-[10px] flex items-center justify-center">
                        <IconSend />
                      </div>
                    </div>
                    <span className="hidden lg:inline font-bold text-lg">Wire Direct</span>
                  </div>
                  <nav className="mt-4 space-y-1">
                    <button className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-[#1c1c1c] text-white text-sm font-semibold">
                      <IconChat />
                      <span className="hidden lg:inline">Messages</span>
                    </button>
                    <button onClick={() => setShowDbModal(true)} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[#a8a8a8] hover:text-white hover:bg-[#1c1c1c] text-sm transition">
                      <IconDatabase />
                      <span className="hidden lg:inline">Database</span>
                    </button>
                  </nav>
                </div>

                <div className="border-t border-[#262626] pt-3 flex items-center gap-2">
                  <img src={currentUser.avatarUrl} className="w-9 h-9 rounded-full ring-2 ring-[#0095f6] object-cover" />
                  <div className="hidden lg:block min-w-0 flex-1 text-left">
                    <div className="text-xs font-semibold truncate">{currentUser.displayName}</div>
                    <div className="text-[10px] text-[#8e8e8e] truncate">{currentUser.email}</div>
                  </div>
                </div>
              </div>

              {/* Inbox List */}
              <div className="flex-1 max-w-md h-full border-r border-[#262626] flex flex-col">
                <div className="p-4 border-b border-[#262626] flex items-center justify-between">
                  <span className="font-bold text-lg">{currentUser.displayName}</span>
                  <span className="text-[11px] bg-emerald-950 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">
                    ONLINE
                  </span>
                </div>

                <div className="p-3">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search accounts or channels..."
                    className="w-full bg-[#262626] text-white text-sm rounded-xl px-4 py-2 focus:outline-none"
                  />
                </div>

                {/* Accounts List */}
                <div className="flex-1 overflow-y-auto divide-y divide-[#1c1c1c]">
                  <div className="px-4 py-2 text-xs font-bold text-[#8e8e8e] uppercase tracking-wider">Direct Accounts</div>
                  {otherContacts.map((contact) => (
                    <div
                      key={contact.uid}
                      onClick={() => setActiveConversation({ id: contact.uid, peer: contact, isChannel: false })}
                      className="px-4 py-3 flex items-center gap-3 hover:bg-[#121212] cursor-pointer transition"
                    >
                      <div className="relative">
                        <img src={contact.avatarUrl} className="w-12 h-12 rounded-full object-cover" />
                        {contact.online && <span className="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-black"></span>}
                      </div>
                      <div className="min-w-0 flex-1 text-left">
                        <div className="font-semibold text-sm text-white">{contact.displayName}</div>
                        <div className="text-xs text-[#8e8e8e] truncate">{contact.statusText}</div>
                      </div>
                    </div>
                  ))}

                  <div className="px-4 py-2 text-xs font-bold text-[#8e8e8e] uppercase tracking-wider mt-2">Team Channels</div>
                  {channels.map((ch) => (
                    <div
                      key={ch.id}
                      onClick={() => setActiveConversation(ch)}
                      className="px-4 py-3 flex items-center gap-3 hover:bg-[#121212] cursor-pointer transition"
                    >
                      <div className="w-12 h-12 rounded-full bg-[#262626] flex items-center justify-center text-lg">
                        {ch.icon}
                      </div>
                      <div className="min-w-0 flex-1 text-left">
                        <div className="font-semibold text-sm text-white">#{ch.name}</div>
                        <div className="text-xs text-[#8e8e8e] truncate">{ch.description}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ACTIVE CALL MODAL */}
          {callSession && (
            <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-between p-6">
              <div className="flex items-center gap-2 bg-[#1a1a1a] px-4 py-1.5 rounded-full border border-[#333]">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span className="font-mono text-xs">LIVE WebRTC SESSION • kartify-a4e66</span>
              </div>

              <div className="relative w-full max-w-2xl h-96 rounded-3xl bg-[#121212] border border-[#262626] flex items-center justify-center overflow-hidden">
                <div className="text-center space-y-3">
                  <img src={callSession.peer.avatarUrl} className="w-24 h-24 rounded-full mx-auto ring-4 ring-[#0095f6]" />
                  <h3 className="text-xl font-bold">{callSession.peer.displayName}</h3>
                  <p className="text-emerald-400 text-xs font-mono">Connected (Live Audio/Video)</p>
                </div>

                {callSession.type === 'video' && (
                  <video ref={videoRef} autoPlay playsInline muted className="absolute top-4 right-4 w-32 h-44 rounded-xl bg-black border border-white/20 object-cover" />
                )}
              </div>

              <div className="flex items-center gap-4 bg-[#1c1c1c] px-6 py-3 rounded-full border border-[#333]">
                <button
                  onClick={() => setCallSession(prev => ({ ...prev, muted: !prev.muted }))}
                  className={`p-3 rounded-full ${callSession.muted ? 'bg-red-500' : 'bg-[#2a2a2a]'}`}
                >
                  {callSession.muted ? <IconMicOff /> : <IconMic />}
                </button>
                <button
                  onClick={() => setCallSession(null)}
                  className="p-3 rounded-full bg-[#ff3040] hover:bg-red-700 text-white"
                >
                  <IconPhoneOff />
                </button>
              </div>
            </div>
          )}

          {/* DATABASE DIAGNOSTICS MODAL */}
          {showDbModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#121824] border border-[#223048] rounded-3xl w-full max-w-lg p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-lg flex items-center gap-2">
                    <IconDatabase />
                    <span>Google Cloud Firestore Status</span>
                  </h3>
                  <button onClick={() => setShowDbModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="bg-[#182236] p-3 rounded-xl">
                    <div className="text-slate-400">Project ID</div>
                    <div className="text-cyan-400 font-mono font-bold mt-1">kartify-a4e66</div>
                  </div>
                  <div className="bg-[#182236] p-3 rounded-xl">
                    <div className="text-slate-400">Ping Latency</div>
                    <div className="text-emerald-400 font-mono font-bold mt-1">21 ms (Healthy)</div>
                  </div>
                </div>
                <div className="text-xs text-slate-400 leading-relaxed">
                  Active connection to Firestore clusters via Secure WebSocket protocol. Real-time message synchronization and call signaling enabled.
                </div>
                <button onClick={() => setShowDbModal(false)} className="w-full py-2.5 rounded-xl bg-cyan-500 text-black font-bold text-xs">
                  Close Diagnostics
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
